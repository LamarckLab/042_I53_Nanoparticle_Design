# Pentamer: the five-fold component of an I53 cage.
#
#   cyclicnano run --config configs/runs/base.yaml --config configs/runs/c5.yaml \
#             --profile configs/profiles/amax.yaml
#
# outdir is relative to the repository root. Redirect it elsewhere with
#   --set run.outdir=/somewhere/else

run:
  name: c5                       # results go to <outroot>/c5

target:
  symmetry: C5                # contig total becomes 5 x monomer_length
