# Preset: select the more compact, helix-rich subunits.
#
# Calibrated against 24 real RFdiffusion C5 backbones (60/75/90 aa, no potentials),
# and tuned to pass roughly a third of them. The point of a preset is to select the
# better candidates, not to demand perfection: an earlier version of this file
# required an all-alpha three-helix fold and passed 1 backbone in 24, which is
# useless.
#
# Overlay on top of the defaults:
#   cyclicnano run --config my_run.yaml --profile configs/presets/compact_subunit.yaml
#
# What the calibration run showed, and why these rules look the way they do:
#
#   * Unconditional RFdiffusion output is predominantly alpha/beta. Median strand
#     fraction was 0.27, so requiring an all-alpha fold rejects nearly everything.
#     If an all-alpha topology is genuinely required, it has to be requested at
#     generation time through fold conditioning, not selected for here.
#   * At 60 aa the median subunit has TWO helices and the maximum seen was three.
#     A rule demanding three or more helices asks for something the model rarely
#     produces at this chain length.
#   * Assembly-level sphericity is already satisfied by default: assembly_shape_
#     anisotropy ran 0.00-0.11 across all 24. It is therefore not filtered on. The
#     variation that matters is in the individual subunit.

backbone_filter:
  rules:
    # --- hard structural requirements, never relax these ---
    - "n_clash == 0"                       # rejected 3/24 in calibration
    - "sym_rmsd <= 0.5"                    # rejected 0/24; a generator sanity check
    - "sym_order_ok"                       # rejected 0/24; likewise

    # --- prefer helix-rich over beta-dominated ---
    - "helix_frac >= 0.50"                 # median was 0.55
    - "strand_frac <= 0.30"                # p75 was 0.30
    - "loop_max_len <= 6"                  # p75 was 6

    # --- prefer compact, low-aspect subunits ---
    - "shape_anisotropy <= 0.28"           # median; the main selection criterion
    - "rg_ratio <= 1.15"                   # between median and p75
    - "axis_ratio <= 2.6"                  # p75 was 2.66
