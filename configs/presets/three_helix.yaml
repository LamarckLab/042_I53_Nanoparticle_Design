# Preset: keep only three-helix bundle subunits.
#
#   cyclicnano run --config configs/runs/base.yaml --config configs/runs/c5.yaml \
#                  --profile configs/profiles/amax.yaml \
#                  --config configs/presets/three_helix.yaml
#
# Why this topology rather than whatever scores best in silico: it is reported to
# succeed far more often in the wet lab. Self-consistency only asks whether a
# sequence folds back to the designed shape; it says nothing about expression,
# solubility or in-vitro assembly, which is where designs actually fail. A metric
# that cannot see the deciding factor should not be the one choosing the target.
#
# Calibrated against 100 real backbones, 50 C5 and 50 C3 at 60 residues.
#
# The rules are deliberately minimal. Adding helix_frac, loop_max_len or clash
# thresholds rejected nothing further on those 100, so they would only be fitted to
# a sample of three. n_clash is kept because overlapping atoms are not a structure,
# whether or not the rule happens to bind.
#
# WARNING ON YIELD. Only 3 of the 100 had this topology, so 50 generated backbones
# yield one or two. Unconditional RFdiffusion output is predominantly alpha/beta:
# 78 of 100 contained strand, and just 22 were all-alpha. Selecting for a shape the
# generator rarely produces is expensive, so this preset is a stopgap until the
# topology can be requested at generation time through fold conditioning.

backbone_filter:
  rules:
    # Exactly three secondary structure elements, all of them helices. Together
    # these two imply n_helices == 3, so stating that as well would be redundant.
    - "n_sse == 3"
    - "strand_frac == 0"

    # Not a topology criterion: a backbone with overlapping atoms is not a structure.
    - "n_clash == 0"
